[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secledger"
version = "0.1.0"
description = "Deterministic, idempotent security-findings ledger and issue filer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = 'Harrison "Taylor" Parsons' }]
keywords = [
    "security", "vulnerability", "findings", "triage", "ledger",
    "gitlab", "github", "appsec", "devsecops", "issues",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/shaggy2nice/secledger"
Issues = "https://github.com/shaggy2nice/secledger/issues"

[project.scripts]
secledger = "secledger.cli:main"
secledger-adapt = "secledger.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
